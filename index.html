<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aschenmond</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#050507;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

.tb{position:fixed;width:66px;height:66px;border-radius:50%;border:1px solid #5a5348;background:#120f12cc;color:#b9b2a4;font:500 12px 'Cinzel',Georgia,serif;padding:0}
#bA{right:18px;bottom:60px;width:78px;height:78px;border-color:#8e1b22}
#bD{right:108px;bottom:18px}
#bH{right:104px;bottom:96px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="600"></canvas></div>
<div id="touch" hidden>
  <div id="stick"><div id="nub"></div></div>
  <button class="tb" id="bA">Hieb</button>
  <button class="tb" id="bD">Rolle</button>
  <button class="tb" id="bH">Trank</button>
</div>
<script>
(()=>{
const W=960,H=600,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const AR={x0:44,y0:120,x1:916,y1:556};
const F="'Cinzel',Georgia,serif",TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,hyp=Math.hypot;
const angd=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const el=(x,y,a,b)=>{ctx.beginPath();ctx.ellipse(x,y,a,b,0,0,TAU);ctx.fill()};

/* ---------- Klang ---------- */
let ac=null;
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}
function tone(f,d,type,v,f2){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d,v,fq){if(!ac)return;try{const n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),g=ac.createGain(),fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=fq||1200;s.buffer=b;g.gain.value=v||.2;s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
const bell=()=>{tone(196,2.4,'sine',.22);tone(392,1.9,'sine',.1);tone(587,1.3,'sine',.05)};

/* ---------- Kulisse ---------- */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
const dec=document.createElement('canvas');dec.width=W;dec.height=H;const dx=dec.getContext('2d');
const LAMPS=[[150,160],[810,160],[150,516],[810,516]];
const obc=document.createElement('canvas');obc.width=W;obc.height=H;
let OB=[],LV=0;
const LAMPOB=LAMPS.map(l=>({c:1,x:l[0],y:l[1],r:8,k:'lamp'}));
const LEVELS={1:[{c:1,x:480,y:330,r:36,k:'well'},{x:190,y:270,w:76,h:42,k:'cart'},{x:690,y:392,w:40,h:40,k:'crate'},{c:1,x:748,y:386,r:14,k:'barrel'},{c:1,x:262,y:446,r:14,k:'barrel'},{x:640,y:214,w:34,h:34,k:'crate'}],
  2:[{c:1,x:250,y:250,r:22,k:'pillar'},{c:1,x:710,y:250,r:22,k:'pillar'},{c:1,x:250,y:440,r:22,k:'pillar'},{c:1,x:710,y:440,r:22,k:'pillar'},{x:320,y:334,w:104,h:22,k:'pew'},{x:536,y:334,w:104,h:22,k:'pew'},{x:424,y:134,w:112,h:30,k:'altar'}]};
function setLevel(lv){LV=lv;OB=LEVELS[lv].concat(LAMPOB);buildBg(lv);dx.clearRect(0,0,W,H)}
function buildBg(lv){const g=bg.getContext('2d');
  const rgb=(r,gg,b)=>'rgb('+(r|0)+','+(gg|0)+','+(b|0)+')';
  const sp=(c,x,y,w,h,n,a)=>{for(let i=0;i<n;i++){c.fillStyle=Math.random()<.5?'rgba(255,255,255,'+a+')':'rgba(0,0,0,'+a*1.8+')';c.fillRect(x+Math.random()*w,y+Math.random()*h,rnd(1,2.4),rnd(1,2.4))}};
  const crack=(x,y,n,col)=>{g.strokeStyle=col;g.lineWidth=1;g.beginPath();g.moveTo(x,y);let a=rnd(0,TAU);for(let i=0;i<n;i++){a+=rnd(-.8,.8);x+=Math.cos(a)*rnd(4,9);y+=Math.sin(a)*rnd(4,9);g.lineTo(x,y)}g.stroke()};
  const dia=(c,x,y,a,b)=>{c.beginPath();c.moveTo(x,y-b);c.lineTo(x+a,y);c.lineTo(x,y+b);c.lineTo(x-a,y);c.closePath()};
  g.fillStyle='#060508';g.fillRect(0,0,W,H);
  if(lv===1){
    for(let y=AR.y0-12,row=0;y<H;y+=22,row++){const off=row%2?13:0;

        let r=l+6,gr=l+5,b=l+11;if(t<.1){gr+=7;b-=3}else if(t<.2){r+=7;gr+=3;b-=4}

        g.fillStyle=gd;rr(g,sx,sy,w,h,6);g.fill();

    g.strokeStyle='rgba(0,0,0,.2)';g.lineWidth=7;for(const o of [0,46]){g.beginPath();g.moveTo(AR.x0,300+o);g.bezierCurveTo(300,250+o,620,470+o,AR.x1,420+o);g.stroke()}

      g.strokeStyle=dk?'rgba(160,160,200,.08)':'rgba(0,0,12,.28)';g.lineWidth=1;
      for(let k=0;k<2;k++){g.beginPath();g.moveTo(x+rnd(3,37),y+rnd(3,37));g.bezierCurveTo(x+rnd(3,37),y+rnd(3,37),x+rnd(3,37),y+rnd(3,37),x+rnd(3,37),y+rnd(3,37));g.stroke()}
      g.fillStyle='rgba(255,255,255,.055)';g.fillRect(x+1,y+1,38,1);g.fillRect(x+1,y+1,1,38);g.fillStyle='rgba(0,0,0,.45)';g.fillRect(x+1,y+38,38,1);g.fillRect(x+38,y+1,1,38);
      if(Math.random()<.06)crack(x+rnd(8,32),y+rnd(8,32),4,'rgba(0,0,0,.55)');
      g.fillStyle='#3d3119';dia(g,x,y,4.5,4.5);g.fill();g.fillStyle='#6e5a2a';dia(g,x,y,2,2);g.fill()}
    /* Altarstufe */
    g.fillStyle='rgba(0,0,0,.45)';g.fillRect(392,112,184,76);
    let sg=g.createLinearGradient(0,112,0,184);sg.addColorStop(0,'#3a3742');sg.addColorStop(1,'#25232b');g.fillStyle=sg;g.fillRect(388,112,184,70);
    g.fillStyle='rgba(255,255,255,.07)';g.fillRect(388,112,184,1.5);g.fillStyle='#17151b';g.fillRect(388,176,184,6);g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1;for(let x=434;x<572;x+=46){g.beginPath();g.moveTo(x,112);g.lineTo(x,176);g.stroke()}
    /* Teppich */
    const cx0=430,cw=100,cy0=AR.y0+62,cy1=AR.y1+2,cl=cy1-cy0,cm=cx0+cw/2;
    g.fillStyle='rgba(0,0,0,.45)';g.fillRect(cx0-4,cy0+3,cw+8,cl+3);
    const cg=g.createLinearGradient(cx0,0,cx0+cw,0);cg.addColorStop(0,'#2b0a10');cg.addColorStop(.18,'#57131c');cg.addColorStop(.5,'#6a1822');cg.addColorStop(.82,'#57131c');cg.addColorStop(1,'#2b0a10');
    g.fillStyle=cg;g.fillRect(cx0,cy0,cw,cl);
    g.save();g.beginPath();g.rect(cx0,cy0,cw,cl);g.clip();
    g.fillStyle='#200810';g.fillRect(cx0+16,cy0+14,cw-32,cl-28);
    const fg2=g.createLinearGradient(cx0+16,0,cx0+cw-16,0);fg2.addColorStop(0,'#3a0c14');fg2.addColorStop(.5,'#4f121b');fg2.addColorStop(1,'#3a0c14');g.fillStyle=fg2;g.fillRect(cx0+18,cy0+16,cw-36,cl-32);
    for(let y=cy0+62,n=0;y<cy1-40;y+=92,n++){
      g.fillStyle='#2a0910';dia(g,cm,y,30,40);g.fill();g.strokeStyle='#b08a3a';g.lineWidth=1.5;g.stroke();
      g.strokeStyle='rgba(199,154,60,.45)';g.lineWidth=1;dia(g,cm,y,25,34);g.stroke();
      g.fillStyle='#18284a';dia(g,cm,y,16,22);g.fill();g.strokeStyle='#c79a3c';g.lineWidth=1.2;g.stroke();
      g.fillStyle='#c79a3c';for(let k=0;k<8;k++){g.beginPath();g.arc(cm+Math.cos(k*TAU/8)*7,y+Math.sin(k*TAU/8)*7,2.4,0,TAU);g.fill()}
      g.fillStyle='#8e1b22';g.beginPath();g.arc(cm,y,3.2,0,TAU);g.fill();g.fillStyle='#e0c070';g.beginPath();g.arc(cm,y,1.2,0,TAU);g.fill();
      g.fillStyle='#c79a3c';for(const q of [[0,-40],[0,40],[-30,0],[30,0]]){g.beginPath();g.arc(cm+q[0],y+q[1],2.6,0,TAU);g.fill()}
      const my=y+46;if(my<cy1-30){g.fillStyle='#8a6a2a';for(const q of [[0,-6],[0,6],[-6,0],[6,0]]){dia(g,cm+q[0],my+q[1],3,3);g.fill()}
        g.strokeStyle='rgba(199,154,60,.5)';g.lineWidth=1.2;for(const s of [-1,1]){g.beginPath();g.arc(cm+s*19,my,7,s>0?Math.PI*.5:Math.PI*1.5,s>0?Math.PI*1.5:Math.PI*.5,s<0);g.stroke();g.beginPath();g.arc(cm+s*19,my,3,0,TAU);g.stroke()}}}
    for(const bx of [cx0+4,cx0+cw-7]){g.fillStyle='#7a5c22';g.fillRect(bx,cy0,3,cl);g.fillStyle='rgba(255,230,160,.25)';g.fillRect(bx,cy0,1,cl)}
    g.fillStyle='#7a5c22';g.fillRect(cx0,cy0+4,cw,3);g.fillRect(cx0,cy1-7,cw,3);
    g.fillStyle='#a8853a';g.fillRect(cx0+15,cy0+14,1,cl-28);g.fillRect(cx0+cw-16,cy0+14,1,cl-28);g.fillRect(cx0+15,cy0+14,cw-30,1);g.fillRect(cx0+15,cy1-15,cw-30,1);
    for(let y=cy0+16,k=0;y<cy1-12;y+=11,k++)for(const bx of [cx0+11,cx0+cw-11]){g.fillStyle=k%2?'#c79a3c':'#22335c';dia(g,bx,y,2.6,4);g.fill()}
    for(let x=cx0+22,k=0;x<cx0+cw-18;x+=11,k++)for(const by of [cy0+10.5,cy1-10.5]){g.fillStyle=k%2?'#c79a3c':'#22335c';dia(g,x,by,4,2.4);g.fill()}
    g.fillStyle='rgba(0,0,0,.17)';for(let y=cy0;y<cy1;y+=3)g.fillRect(cx0,y,cw,1);
    g.fillStyle='rgba(255,210,180,.04)';for(let x=cx0;x<cx0+cw;x+=4)g.fillRect(x,cy0,1,cl);
    for(let i=0;i<12;i++){const bx=rnd(cx0,cx0+cw),by=rnd(cy0,cy1),br=rnd(18,46),wg=g.createRadialGradient(bx,by,2,bx,by,br),dk=Math.random()<.6;
      wg.addColorStop(0,dk?'rgba(0,0,0,.3)':'rgba(190,170,150,.1)');wg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=wg;g.fillRect(bx-br,by-br,br*2,br*2)}
    for(const fy of [cy0+118,cy0+247,cy0+322]){g.fillStyle='rgba(255,225,205,.07)';g.fillRect(cx0,fy,cw,2);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(cx0,fy+2,cw,2)}
    sp(g,cx0,cy0,cw,cl,1100,.035);g.restore();
    g.strokeStyle='rgba(205,180,120,.75)';g.lineWidth=1;for(let x=cx0+1;x<cx0+cw;x+=3){g.beginPath();g.moveTo(x,cy1);g.lineTo(x+rnd(-1,1),cy1+rnd(5,8));g.moveTo(x,cy0);g.lineTo(x+rnd(-1,1),cy0-rnd(4,7));g.stroke()}
  }
  /* Rückwand */
  for(let y=0,row=0;y<AR.y0-16;y+=13,row++)for(let x=(row%2?-16:0);x<W;x+=32){const l=17+(Math.random()*10|0);g.fillStyle=lv===1?rgb(l+4,l+2,l+7):rgb(l+6,l+3,l+5);g.fillRect(x+1,y+1,30,11);g.fillStyle='rgba(255,255,255,.04)';g.fillRect(x+1,y+1,30,1)}
  const wg2=g.createLinearGradient(0,0,0,AR.y0-16);wg2.addColorStop(0,'rgba(2,2,5,.9)');wg2.addColorStop(1,'rgba(2,2,5,.2)');g.fillStyle=wg2;g.fillRect(0,0,W,AR.y0-16);
  const PAL=['#7a1c26','#1e3a78','#8a6a1c','#1f5a44','#5a2068','#a04018'];
  for(let i=0;i<9;i++){const x=67+i*100,lit=lv===1?(i===2||i===5||i===6):i%3!==1;
    const wp=()=>{g.beginPath();g.moveTo(x,98);g.lineTo(x,54);g.quadraticCurveTo(x,32,x+13,24);g.quadraticCurveTo(x+26,32,x+26,54);g.lineTo(x+26,98);g.closePath()};
    g.save();wp();g.clip();
    if(lit&&lv===2){for(let yy=22;yy<100;yy+=8)for(let xx=x-2+((yy/8|0)%2?3:0);xx<x+28;xx+=7){g.fillStyle=PAL[Math.random()*PAL.length|0];g.fillRect(xx,yy,7,8)}
      g.strokeStyle='rgba(5,5,8,.8)';g.lineWidth=1;for(let yy=22;yy<100;yy+=8){g.beginPath();g.moveTo(x,yy);g.lineTo(x+26,yy);g.stroke()}for(let xx=x-2;xx<x+28;xx+=7){g.beginPath();g.moveTo(xx,22);g.lineTo(xx,100);g.stroke()}
      g.fillStyle='#d8b050';g.beginPath();g.arc(x+13,50,6,0,TAU);g.fill();g.strokeStyle='#0a0a0e';g.stroke();
      const hl=g.createRadialGradient(x+13,56,2,x+13,56,40);hl.addColorStop(0,'rgba(255,230,190,.35)');hl.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=hl;g.fillRect(x,20,26,80)}

    txt('Du trägst '+ash+' Asche.   Bisher: +'+bon+' %',W/2,216,15,'#b9b2a4');
    const cs=upCards(),T={h:['500 Asche opfern','+1 % Leben und Schaden'],k:['1000 Asche opfern','+3 % Leben und Schaden'],w:['Auf 1000 warten','dann +3 %  ·  der Tod halbiert die Asche']};
    cs.forEach((c,i)=>{const hov=!touch&&mouse.x>c.x&&mouse.x<c.x+c.w&&mouse.y>c.y&&mouse.y<c.y+c.h,t=T[c.id];
      ctx.fillStyle=hov?'#211a1c':'#120f12';rr(ctx,c.x,c.y,c.w,c.h,6);ctx.fill();ctx.strokeStyle=c.id==='w'?'#5a5348':'#8e1b22';ctx.lineWidth=hov?3:1.5;ctx.stroke();
      txt(t[0],c.x+c.w/2,c.y+52,20,'#d8cfba','center',700);txt(t[1],c.x+c.w/2,c.y+82,12,c.id==='w'?'#9a9282':'#b86a1e');
      txt(touch?'Tippen':'Taste '+(i+1)+' oder Klick',c.x+c.w/2,c.y+112,11,'#7d7566')});
    if(cs.length===1)txt('Ab 1000 Asche bleibt nur das große Opfer.',W/2,412,13,'#7d7566')}
  if(mode==='dead'){const a=clamp(modeT/1.2,0,1);ctx.fillStyle='rgba(0,0,0,'+a*.68+')';ctx.fillRect(0,0,W,H);ctx.globalAlpha=a;
    txt('DIE NACHT VERSCHLINGT DICH',W/2,290,44,'#8e1b22','center',700);txt('Die Hälfte deiner Asche verweht.',W/2,326,15,'#9a9282');
    if(modeT>.9)txt(touch?'Tippen — zurück zur Laterne':'Klick oder R — zurück zur Laterne',W/2,372,16,'#b9b2a4');ctx.globalAlpha=1}
  if(mode==='win'){const a=clamp(modeT/1.5,0,1);ctx.fillStyle='rgba(8,6,4,'+a*.7+')';ctx.fillRect(0,0,W,H);ctx.globalAlpha=a;
    txt('DER MORGEN GRAUT',W/2,270,52,'#c79a3c','center',700);if(cheat)txt('Testlauf',W/2,222,13,'#7d7566');ctx.fillStyle='#c79a3c';ctx.fillRect(W/2-150,288,300,2);
    const m=runT/60|0,s=(runT%60|0);txt('Asche  '+ash+'     ·     Macht  +'+bon+' %     ·     Tode  '+deaths+'     ·     Zeit  '+m+':'+(s<10?'0':'')+s,W/2,326,17,'#d8cfba');
    if(modeT>.9)txt(touch?'Tippen — noch eine Jagd':'Klick — noch eine Jagd',W/2,380,16,'#9a9282');ctx.globalAlpha=1}}

let last=performance.now();
function loop(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;time+=dt;modeT+=dt;
  if(mode==='play'){if(hitstop>0)hitstop-=dt;else update(dt)}
  if(mode!=='title'&&mode!=='up'&&mode!=='test')updFx(dt);
  draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
